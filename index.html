<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФРАНИК ШОП | MM2 Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-glow { box-shadow: 0 0 25px rgba(59, 130, 246, 0.25); }
        .neon-btn:hover { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .card-hover:hover { transform: translateY(-4px); border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        body { background-color: #030712; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <header class="border-b border-blue-900/40 bg-gray-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">ФРАНИК ШОП</h1>
            <a href="https://t.me/@ffranyk" target="_blank" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-xl transition duration-300 neon-btn">Telegram</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        <div class="p-6 rounded-2xl bg-gradient-to-r from-blue-950/60 to-gray-900 border border-blue-800/40 neon-glow">
            <h2 class="text-xl font-extrabold mb-2 text-white">Найкращі речі Murder Mystery 2 🔪</h2>
            <p class="text-sm text-gray-400">Обирай категорію нижче, щоб знайти потрібну гармату чи ніж.</p>
        </div>

        <div class="flex justify-center flex-wrap gap-2">
            <button onclick="filterCategory('knife')" id="btn-knife" class="category-btn bg-blue-600 text-white px-5 py-2 rounded-xl text-xs font-bold transition"> Ножі</button>
            <button onclick="filterCategory('gun')" id="btn-gun" class="category-btn bg-gray-900 border border-gray-800 text-gray-300 px-5 py-2 rounded-xl text-xs font-bold transition"> Пістолети</button>
            <button onclick="filterCategory('set')" id="btn-set" class="category-btn bg-gray-900 border border-gray-800 text-gray-300 px-5 py-2 rounded-xl text-xs font-bold transition"> Сети</button>
        </div>

        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            
            <!-- КАРТКА (Квадратна 1:1) -->
            <div class="product-card bg-gray-900/80 border border-gray-800/80 rounded-2xl p-4 flex flex-col justify-between card-hover transition duration-300" data-category="knife">
                <div>
                    <!-- Тут тепер aspect-square w-full для квадрата -->
                    <div class="bg-blue-950/40 border border-blue-900/30 aspect-square w-full rounded-xl mb-3 overflow-hidden flex items-center justify-center relative">
                        <span class="absolute top-2 left-2 bg-purple-600 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">Unique</span>
                        <img src="https://i.postimg.cc/ydd8Zr3h/Bez-nazvania-(2).webp" class="w-full h-full object-cover">
                    </div>
                    <h3 class="font-bold text-lg text-white mb-3">Corrupt</h3>
                </div>
                <div class="flex items-center justify-between pt-3 border-t border-gray-800">
                    <span class="text-xl font-black text-blue-400">500 ₴</span>
                    <span class="text-[11px] bg-blue-950 text-blue-300 border border-blue-800/50 px-2.5 py-1 rounded-lg font-bold">В наявності</span>
                </div>
            </div>

        </div>
    </main>

    <script>
        function filterCategory(category) {
            const cards = document.querySelectorAll('.product-card');
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-900', 'text-gray-300', 'border', 'border-gray-800');
            });
            document.getElementById('btn-' + category).classList.remove('bg-gray-900', 'text-gray-300', 'border', 'border-gray-800');
            document.getElementById('btn-' + category).classList.add('bg-blue-600', 'text-white');
            cards.forEach(card => card.style.display = (card.getAttribute('data-category') === category) ? 'flex' : 'none');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФРАНИК ШОП | MM2 Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-glow { box-shadow: 0 0 25px rgba(59, 130, 246, 0.25); }
        .neon-btn:hover { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .card-hover:hover { transform: translateY(-4px); border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        body { background-color: #030712; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-600 selection:text-white pb-36">

    <header class="border-b border-blue-900/40 bg-gray-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">ФРАНИК ШОП</h1>
            <a href="https://t.me/ffranyk" target="_blank" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-xl transition duration-300 neon-btn">Telegram</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        <div class="p-6 rounded-2xl bg-gradient-to-r from-blue-950/60 to-gray-900 border border-blue-800/40 neon-glow">
            <h2 class="text-xl font-extrabold mb-2 text-white">Найкращі речі Murder Mystery 2 🔪</h2>
            <p class="text-sm text-gray-400">Обирай категорію нижче, шукай за назвою або сортуй за ціною.</p>
        </div>

        <!-- ПАНЕЛЬ ПОШУКУ ТА СОРТУВАННЯ -->
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-grow">
                <input type="text" id="search-input" oninput="applyFilters()" placeholder="Пошук гармати чи ножа..." class="w-full bg-gray-900 border border-gray-800 text-white text-xs md:text-sm rounded-xl px-4 py-3 pl-10 focus:outline-none focus:border-blue-500 transition">
                <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <select id="sort-select" onchange="applyFilters()" class="bg-gray-900 border border-gray-800 text-gray-300 text-xs md:text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition cursor-pointer">
                <option value="default">Сортування: за замовчуванням</option>
                <option value="asc">Спочатку дешевші</option>
                <option value="desc">Спочатку дорожчі</option>
            </select>
        </div>

        <!-- КНОПКИ ФІЛЬТРІВ -->
        <div class="flex justify-center flex-wrap gap-2">
            <button onclick="setCategory('knife')" id="btn-knife" class="category-btn bg-blue-600 text-white px-5 py-2 rounded-xl text-xs font-bold transition">🔪 Ножі</button>
            <button onclick="setCategory('gun')" id="btn-gun" class="category-btn bg-gray-900 border border-gray-800 text-gray-300 px-5 py-2 rounded-xl text-xs font-bold transition">🔫 Пістолети</button>
            <button onclick="setCategory('set')" id="btn-set" class="category-btn bg-gray-900 border border-gray-800 text-gray-300 px-5 py-2 rounded-xl text-xs font-bold transition">📦 Сети</button>
        </div>

        <!-- КАТАЛОГ ТОВАРІВ -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            
            <!-- ТОВАР 1 -->
            <div class="product-card bg-gray-900/80 border border-gray-800/80 rounded-2xl p-4 flex flex-col justify-between card-hover transition duration-300" data-category="knife" data-price="500">
                <div>
                    <div class="bg-blue-950/40 border border-blue-900/30 aspect-square w-full rounded-xl mb-3 overflow-hidden flex items-center justify-center relative">
                        <span class="absolute top-2 left-2 bg-purple-600 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">Unique</span>
                        <img src="https://i.postimg.cc/Ls16mZfd/Corrupt-Weapon.webp" class="w-full h-full object-cover">
                    </div>
                    <h3 class="product-name font-bold text-sm text-white mb-1">Corrupt</h3>
                </div>
                <div>
                    <div class="flex items-center justify-between pt-2 mb-3 border-t border-gray-800 gap-1">
                        <span class="product-price text-sm md:text-lg font-black text-blue-400">500 ₴</span>
                        <span class="text-[9px] bg-blue-950 text-blue-300 border border-blue-800/50 px-1.5 py-0.5 rounded-md font-bold">В наявності</span>
                    </div>
                    <button onclick="addItemToCart(this)" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-xs font-bold transition">У кошик</button>
                </div>
            </div>

            <!-- ТОВАР 2 -->
            <div class="product-card bg-gray-900/80 border border-gray-800/80 rounded-2xl p-4 flex flex-col justify-between card-hover transition duration-300" data-category="gun" data-price="2300">
                <div>
                    <div class="bg-blue-950/40 border border-blue-900/30 aspect-square w-full rounded-xl mb-3 overflow-hidden flex items-center justify-center relative">
                        <span class="absolute top-2 left-2 bg-blue-600 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">Godly</span>
                        <img src="https://i.postimg.cc/X75rVm0m/Raygun.webp" class="w-full h-full object-cover">
                    </div>
                    <h3 class="product-name font-bold text-sm text-white mb-1">Raygun</h3>
                </div>
                <div>
                    <div class="flex items-center justify-between pt-2 mb-3 border-t border-gray-800 gap-1">
                        <span class="product-price text-sm md:text-lg font-black text-blue-400">2300 ₴</span>
                        <span class="text-[9px] bg-blue-950 text-blue-300 border border-blue-800/50 px-1.5 py-0.5 rounded-md font-bold">В наявності</span>
                    </div>
                    <button onclick="addItemToCart(this)" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-xs font-bold transition">У кошик</button>
                </div>
            </div>

            <!-- ТОВАР 3 -->
            <div class="product-card bg-gray-900/80 border border-gray-800/80 rounded-2xl p-4 flex flex-col justify-between card-hover transition duration-300" data-category="set" data-price="900">
                <div>
                    <div class="bg-blue-950/40 border border-blue-900/30 aspect-square w-full rounded-xl mb-3 overflow-hidden flex items-center justify-center relative">
                        <span class="absolute top-2 left-2 bg-yellow-600 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">Set</span>
                        <img src="https://i.postimg.cc/CKcHV5y8/Bloom-Set.webp" class="w-full h-full object-cover">
                    </div>
                    <h3 class="product-name font-bold text-sm text-white mb-1">Flora Set</h3>
                </div>
                <div>
                    <div class="flex items-center justify-between pt-2 mb-3 border-t border-gray-800 gap-1">
                        <span class="product-price text-sm md:text-lg font-black text-blue-400">900 ₴</span>
                        <span class="text-[9px] bg-blue-950 text-blue-300 border border-blue-800/50 px-1.5 py-0.5 rounded-md font-bold">В наявності</span>
                    </div>
                    <button onclick="addItemToCart(this)" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-xs font-bold transition">У кошик</button>
                </div>
            </div>

            <!-- ТОВАР 4 -->
            <div class="product-card bg-gray-900/80 border border-gray-800/80 rounded-2xl p-4 flex flex-col justify-between card-hover transition duration-300" data-category="knife" data-price="450">
                <div>
                    <div class="bg-blue-950/40 border border-blue-900/30 aspect-square w-full rounded-xl mb-3 overflow-hidden flex items-center justify-center relative">
                        <span class="absolute top-2 left-2 bg-purple-600 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider">Unique</span>
                        <img src="https://i.postimg.cc/ZK1JVx02/Wand-Full-HD.webp" class="w-full h-full object-cover">
                    </div>
                    <h3 class="product-name font-bold text-sm text-white mb-1">Heartwand</h3>
                </div>
                <div>
                    <div class="flex items-center justify-between pt-2 mb-3 border-t border-gray-800 gap-1">
                        <span class="product-price text-sm md:text-lg font-black text-blue-400">450 ₴</span>
                        <span class="text-[9px] bg-blue-950 text-blue-300 border border-blue-800/50 px-1.5 py-0.5 rounded-md font-bold">В наявності</span>
                    </div>
                    <button onclick="addItemToCart(this)" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-xs font-bold transition">У кошик</button>
                </div>
            </div>
            
        </div>
    </main>

    <!-- НИЖНЯ ПАНЕЛЬ -->
    <div class="fixed bottom-0 left-0 w-full bg-gray-950/95 border-t border-blue-900/40 p-4 shadow-2xl backdrop-blur-md z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-3">
            <div>
                <p class="text-xs text-gray-400">Товарів: <span id="cart-items" class="text-white font-bold">0</span></p>
                <p class="text-md font-black">Сума: <span id="cart-total" class="text-blue-400">0</span> ₴</p>
            </div>
            <div class="flex gap-2">
                <button onclick="clearCart()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl text-xs font-bold transition">Очистити</button>
                <a id="tg-checkout-btn" href="https://t.me/ffranyk" target="_blank" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-xl font-bold text-xs text-center transition pointer-events-none opacity-50">Замовити</a>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let currentCategory = 'knife';

        function addItemToCart(button) {
            const card = button.closest('.product-card');
            const name = card.querySelector('.product-name').innerText;
            const price = parseFloat(card.getAttribute('data-price'));
            cart.push({name, price});
            updateCart();
        }

        function clearCart() { cart = []; updateCart(); }

        function updateCart() {
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-items').innerText = cart.length;
            document.getElementById('cart-total').innerText = total;
            const tgBtn = document.getElementById('tg-checkout-btn');
            if (cart.length === 0) tgBtn.classList.add('pointer-events-none', 'opacity-50');
            else tgBtn.classList.remove('pointer-events-none', 'opacity-50');
        }

        function setCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = btn.id === 'btn-'+category ? 
                'category-btn bg-blue-600 text-white px-5 py-2 rounded-xl text-xs font-bold transition' : 
                'category-btn bg-gray-900 border border-gray-800 text-gray-300 px-5 py-2 rounded-xl text-xs font-bold transition';
            });
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const sort = document.getElementById('sort-select').value;
            const grid = document.getElementById('product-grid');
            let cards = Array.from(grid.querySelectorAll('.product-card'));
            
            let visible = cards.filter(c => c.getAttribute('data-category') === currentCategory && c.querySelector('.product-name').innerText.toLowerCase().includes(search));
            
            if(sort !== 'default') visible.sort((a,b) => sort === 'asc' ? a.dataset.price - b.dataset.price : b.dataset.price - a.dataset.price);
            
            cards.forEach(c => c.classList.add('hidden'));
            visible.forEach(c => { c.classList.remove('hidden'); c.classList.add('flex'); grid.appendChild(c); });
        }
        setCategory('knife');
    </script>
</body>
</html>
